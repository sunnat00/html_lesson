<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Sementics</title>
    <style>
        .box {
            background-color: blue;
            font-size: 20px;
            color: white;
            text-align: center;
        }

        header {
            background-color: blue;
            height: 100px;
            font-size: 20px;
            color: white;
            text-align: center;
            line-height: 100px;
        }

        nav {
            margin-top: 10px;
            background-color: green;
            height: 50px;
            font-size: 18px;
            color: white;
            text-align: center;
            line-height: 50px;
        }

        section {
            height: 500px;
            margin-top: 10px;
            line-height: 500px;
            text-align: center;
            width: 70%;
            color: white;
            float: left;
        }

        aside {
            height: 500px;
            margin-top: 10px;
            line-height: 500px;
            text-align: center;
            width: 30%;
            color: white;
            float: left;

        }

        footer {
            height: 100px;
            margin-top: 10px;
            line-height: 100px;
            float: left;
            width: 100%;
        }
    </style>
</head>

        Header
    </header>

        Navigation
