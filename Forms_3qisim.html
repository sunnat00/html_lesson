<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms_3qisim</title>
</head>

<body>
    <form action="/server.php" method="get">
        <label for="username">Username</label>
        <input type="text" name="username" id="username"> <br> <br>
        <label for="password">Password</label>
        <input type="password" name="password" id="password"> <br> <br>
        <label for="email">Emailingiz</label>
        <input type="email" name="email" id="email"> <br> <br>
        <label for="sana">Tugilgan sana</label>
        <input type="date" name="date" id="sana"> <br> <br>
        <label for="student">Talaba</label>
        <input type="checkbox" name="student" id="student">
        <hr>
        <label for="erkak">Erkak</label>
        <input type="radio" name="gender" id="erkak" value="erkak">
        <label for="ayol">Ayol</label>
        <input type="radio" name="gender" id="ayol" value="ayol"> <br> <br>
        <label for="Passport">Passport</label>
        <input type="file" name="passport" id="Passport"> <br> <br>
        <hr>
        <label for="tajriba">Tajribangiz (yil)</label>
        <select name="experience" id="tajriba">
            <option value="0-1">0-1 yil</option>
            <option value="1-3">1-3 yil</option>
            <option value="3-5">3-5 yil</option>
            <option value="5+">5+ yil</option>
        </select> <br> <br>

        <label for="haqida"> Siz haqingizda</label> <br>
        <textarea name="about" id="haqida" cols="30" rows="5"></textarea> <br> <br>


        <button type=" submit">Ro'yhatdan o'tish</button>
    </form>
</body>

</html>
