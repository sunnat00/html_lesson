<head>

    <title>Jadvalar_tables</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            text-align: left;
        }



        th,
        td {
            border: 1px solid black;
            padding: 5px;
        }

        td {
            border: 1px solid black;
            padding: 5px;
        }
    </style>
</head>

                <td>1</td>

            </tr>
            <tr>
                <td>2</td>

            <tr>

</html>
